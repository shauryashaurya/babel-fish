# builds the site and deploys it to GitHub Pages
name: deploy

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

# one deployment at a time; a newer push does not cancel a deployment already running
concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  check-latest: true
                  cache: npm
            - run: npm ci
            - run: npm run test:data
            - run: npm run test:exports
            - run: npm run test:framework
            - run: npm run test:security
            - run: npm run test:rag
            - run: npm run check
            - run: npm run build
            - uses: actions/upload-pages-artifact@v5
              with:
                  path: dist

    # a separate job, so the uploaded artifact is visible before deploy looks for it
    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v5
